<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment...</title>

    <!-- SEO: prevent search engine indexing of this redirect page -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Referrer: do not leak payment details (VPA, amount) to gateway servers -->
    <meta name="referrer" content="no-referrer">

    <!--
        Content Security Policy:
        - unsafe-inline is REMOVED — inline scripts are not permitted.
        - router.js is whitelisted by its exact SHA-256 hash (SRI).
        - QRCode CDN is whitelisted by domain; its bytes are verified by the
          integrity= attribute on the <script> tag below.
        - frame-ancestors is declared here for completeness but only enforced
          via the HTTP header in _headers (see that file).
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   script-src 'sha256-t0+18TJSxSiuPv655v+nwOwixkgm89AZFlJ8QM47glU='
                               https://cdnjs.cloudflare.com;
                   style-src 'unsafe-inline';
                   img-src 'self' data:;
                   connect-src 'none';
                   frame-ancestors 'none';">

    <!--
        QRCode library loaded from a trusted CDN.
        The integrity= hash is verified by the browser before execution.
        If the CDN serves different bytes (tampered/compromised), it is refused.
    -->
    <script id="qrcode-library" async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
            integrity="sha256-xUHvBjJ4hahBW8qN9gceFBibSFUzbe9PNttUvehITzY="
            crossorigin="anonymous"></script>

    <!--
        Payment routing logic in an external file, verified by SRI hash.
        Keeping JS external allows CSP to whitelist it by hash without unsafe-inline.
    -->
    <script src="./router.js"
            integrity="sha256-t0+18TJSxSiuPv655v+nwOwixkgm89AZFlJ8QM47glU="
            crossorigin="anonymous"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0070f3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        #qrcode {
            margin: 20px auto;
            padding: 10px;
            background: white;
            display: inline-block;
            border: 1px solid #eaeaea;
            border-radius: 8px;
        }

        .hidden {
            display: none !important;
        }

        .error {
            color: #dc2626;
            font-weight: 500;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- State 1: Connecting / Redirecting (Mobile or Gateway Redirect) -->
        <div id="redirecting-state">
            <div class="loader"></div>
            <h3>Connecting to Gateway...</h3>
            <p>Please wait while we route you securely to finish your payment.</p>
        </div>

        <!-- State 2: Desktop UPI Fallback (QR Code Shown) -->
        <div id="desktop-state" class="hidden">
            <h3>Scan to Pay</h3>
            <p>Open any UPI app (GPay, PhonePe, Paytm) and scan the QR code below to complete payment.</p>
            <div id="qrcode"></div>
        </div>

        <!-- State 3: Errors / Blocks -->
        <div id="error-state" class="hidden">
            <h3 class="error">Payment Blocked</h3>
            <p id="error-message">This redirect cannot be processed safely.</p>
        </div>
    </div>

</body>

</html>
